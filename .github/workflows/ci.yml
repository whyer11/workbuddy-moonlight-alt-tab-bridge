name: Bridge CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android and native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865'

      - name: Verify generated protocol
        shell: pwsh
        run: ./protocol/tests/GeneratedSchemaTest.ps1

      - name: Run native unit tests
        shell: bash
        run: scripts/ci/run-native-tests.sh

      - name: Build Android ARM64 bridge
        shell: bash
        run: |
          ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/29.0.14206865" \
            scripts/ci/build-native-android.sh
          install -m 0755 \
            build/ci/native/alttab_evdev_bridge \
            android-bridge/app/src/main/assets/alttab_evdev_bridge

      - name: Test and build Android Debug APK
        shell: bash
        run: ./android-bridge/gradlew -p android-bridge :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: WorkBuddy-Bridge-debug-apk
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows host tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Test and package Windows host
        shell: pwsh
        env:
          RELEASE_VERSION: ci
        run: ./scripts/ci/build-windows.ps1 -SkipInteractiveTests

      - name: Upload Windows host package
        uses: actions/upload-artifact@v7
        with:
          name: WorkBuddy-Bridge-Windows-ci
          path: build/ci/windows/WorkBuddy-Bridge-Windows-ci.zip
          if-no-files-found: error
          retention-days: 7
